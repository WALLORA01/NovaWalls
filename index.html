<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wallpaper Hub Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f172a;
  color: white;
}

header {
  padding: 15px;
  text-align: center;
  background: #1e293b;
}

input, button, select {
  padding: 10px;
  margin: 5px;
  border-radius: 5px;
  border: none;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
  gap: 10px;
  padding: 20px;
}

.card {
  background: #1e293b;
  border-radius: 10px;
  overflow: hidden;
  position: relative;
}

.card img {
  width: 100%;
}

.tag {
  position: absolute;
  top: 10px;
  left: 10px;
  padding: 5px;
  border-radius: 5px;
}

.free { background: green; }
.premium { background: red; }

.download {
  position: absolute;
  bottom: 10px;
  right: 10px;
  background: black;
  padding: 5px;
  cursor: pointer;
}
</style>
</head>

<body>

<header>
  🌌 Wallpaper Hub Pro  
  <br>
  <input type="text" id="search" placeholder="Search...">
  <button onclick="searchWallpapers()">Search</button>
</header>

<div style="text-align:center;">
  <button onclick="filter('all')">All</button>
  <button onclick="filter('free')">Free</button>
  <button onclick="filter('premium')">Premium</button>
</div>

<div style="text-align:center;">
  <input type="file" id="file">
  <select id="type">
    <option value="free">Free</option>
    <option value="premium">Premium</option>
  </select>
  <button onclick="upload()">Upload</button>
</div>

<div style="text-align:center;">
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button onclick="signup()">Sign Up</button>
  <button onclick="login()">Login</button>
</div>

<div class="gallery" id="gallery"></div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-storage.js"></script>

<script>
// 🔥 PASTE YOUR FIREBASE CONFIG HERE
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_ID",
  storageBucket: "YOUR_BUCKET",
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();

let wallpapers = [];
let user = null;

// AUTH
function signup() {
  auth.createUserWithEmailAndPassword(email.value, password.value);
}

function login() {
  auth.signInWithEmailAndPassword(email.value, password.value);
}

auth.onAuthStateChanged(u => {
  user = u;
});

// UPLOAD
async function upload() {
  const file = document.getElementById("file").files[0];
  const type = document.getElementById("type").value;

  if (!file) return alert("Select file");

  const ref = storage.ref("wallpapers/" + file.name);
  await ref.put(file);
  const url = await ref.getDownloadURL();

  await db.collection("wallpapers").add({
    url: url,
    type: type,
    name: file.name
  });

  loadWallpapers();
}

// LOAD
async function loadWallpapers() {
  const snapshot = await db.collection("wallpapers").get();
  wallpapers = snapshot.docs.map(doc => doc.data());
  display(wallpapers);
}

function display(list) {
  const gallery = document.getElementById("gallery");
  gallery.innerHTML = "";

  list.forEach(w => {
    gallery.innerHTML += `
      <div class="card">
        <img src="${w.url}">
        <div class="tag ${w.type}">${w.type}</div>
        <div class="download" onclick="download('${w.url}','${w.type}')">⬇</div>
      </div>
    `;
  });
}

// FILTER
function filter(type) {
  if (type === "all") return display(wallpapers);
  display(wallpapers.filter(w => w.type === type));
}

// SEARCH
function searchWallpapers() {
  const q = document.getElementById("search").value.toLowerCase();
  display(wallpapers.filter(w => w.name.toLowerCase().includes(q)));
}

// DOWNLOAD
function download(url, type) {
  if (type === "premium" && !user) {
    alert("Login required for premium!");
    return;
  }
  window.open(url);
}

loadWallpapers();
</script>

</body>
</html>
